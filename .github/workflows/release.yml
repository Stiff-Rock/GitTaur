name: Deploy and Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  deploy-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -Ctarget-cpu=native
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.3.6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        id: rust-cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Cache Deno dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-
      
      - name: Install dependencies
        run: deno install
        
      - name: Build Tauri application
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          cd src-tauri
          cargo build --release
      
      - name: Deploy
        run: deno task deploy
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./src-tauri/target/release/GitTaur.exe
            ./src-tauri/target/release/bundle/msi/GitTaur_0.1.0_x64_en-US.msi
            ./src-tauri/target/release/bundle/nsis/GitTaur_0.1.0_x64-setup.exe
