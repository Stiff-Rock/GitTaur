name: Deploy and Release on Tag

on:
  push:
    tags:
      - '*'

jobs:
  deploy-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.3.6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Cache Deno dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-
      
      - name: Install Tauri CLI
        run: cargo install tauri-cli
      
      - name: Install Windows dependencies
        run: |
          # Install Windows dependencies for Tauri
          # This typically includes WebView2, but the GH Actions Windows runner should have it
          choco install -y nsis  # For installer creation
      
      - name: Build with Tauri
        run: |
          cd src-tauri
          cargo tauri build --verbose
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./src-tauri/target/release/GitTaur.exe
            ./src-tauri/target/release/bundle/msi/GitTaur_0.1.0_x64_en-US.msi
            ./src-tauri/target/release/bundle/nsis/GitTaur_0.1.0_x64-setup.exe
