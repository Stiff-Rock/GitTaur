[package]
name = "gittaur"
version = "0.1.0"
description = "A Git GUI client made in tauri"
authors = ["StiffRock"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gittaur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri plugins
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.2.1"

serde_json = "1"
serde = { version = "1", features = ["derive"] }

# Project specific dependencies
git2 = {version="0.20.0", features = [] }
auth-git2-pem = { git = "https://github.com/Stiff-Rock/auth-git2-rs.git", branch="pure-rust" }

chrono = "0.4.40"
regex = "1.11.1"
indexmap = {version= "2.8.0", features = ["serde"] }
dirs = "6.0.0"
notify = "8.0.0"
tokio="1.45.1"

log = "0.4.27"
fern = { version = "0.7.1", features = ["colored"] }
tinyfiledialogs = "3.9.1"

[target.'cfg(unix)'.dependencies.git2]
version = "0.20.0"
features = ["vendored-openssl"]

[target.'cfg(windows)'.dependencies.git2]
version = "0.20.0"
features = ["vendored-libgit2"]
